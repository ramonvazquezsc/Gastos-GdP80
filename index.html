<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<title>Gastos de casa</title>
<script>
try {
  var t = localStorage.getItem('tema');
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
} catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
:root{
  --bg:#F4F5FB; --card:#fff; --text:#1E2233; --muted:#7A8094; --border:#E8EAF3;
  --round:"Nunito",ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --primary:#6C5CE7; --primary-soft:#EFECFF; --danger:#E5484D; --shadow:0 4px 20px rgba(30,34,80,.06);
}
:root{color-scheme:light}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#0F111A; --card:#181B27; --text:#ECEEF6; --muted:#9097AD;
  --border:#262A3B; --primary-soft:#2A2550; --shadow:none; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.hidden{display:none!important}
h3{margin:22px 4px 10px;font-size:15px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.card h3{margin:0 0 12px}
 
#app{max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(96px + env(safe-area-inset-bottom,0px))}
 
/* Cabecera */
.hero{background:linear-gradient(135deg,#6C5CE7,#9B8CFF);color:#fff;border-radius:24px;
  padding:18px 20px 14px;box-shadow:0 10px 28px rgba(108,92,231,.3);margin-bottom:16px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero-btns{display:flex;gap:8px}
.hero .t{display:flex;align-items:center;font-family:var(--round);font-size:21px;font-weight:800;letter-spacing:-.01em}
.flag{width:27px;height:18px;border-radius:3px;margin-right:9px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.hero-sum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:8px}
.hero .big{font-family:var(--round);font-size:28px;font-weight:800;letter-spacing:-.01em}
.hero .s{font-size:13px;opacity:.85}
.hero-cmp{font-size:13px;font-weight:700;margin-top:6px}
.hero-sub{font-size:12px;font-weight:600;opacity:.8;margin-top:14px;letter-spacing:.02em}
.hero-chart{position:relative;height:175px;margin-top:6px}
.hero-leg{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.lg{display:inline-block;width:16px;height:0;border-top:3px solid #fff;margin-right:6px;vertical-align:middle;border-radius:2px}
.lg.dash{border-top:2px dashed rgba(255,255,255,.75)}
.icon-btn{background:rgba(255,255,255,.2);border:none;border-radius:12px;width:40px;height:40px;
  display:grid;place-items:center;color:#fff}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
 
/* Tarjetas y formularios */
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);
  border:1px solid var(--border);margin-bottom:14px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 8px}
.lbl:first-child{margin-top:0}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],input[type=number],select{
  width:100%;font-size:16px;padding:14px;border-radius:14px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--primary);outline:none}
.amount-card{text-align:center;padding:22px 16px}
.amount{display:flex;justify-content:center;align-items:baseline;gap:6px}
.amount input{width:5ch;max-width:75%;text-align:center;font-family:var(--round);font-size:58px;font-weight:800;
  border:none;background:transparent;padding:0;outline:none;box-shadow:none;color:var(--text);caret-color:var(--primary)}
.amount input::placeholder{color:var(--muted);opacity:.4}
.amount span{font-family:var(--round);font-size:36px;font-weight:800;color:var(--muted)}
 
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--bg);
  padding:4px;border-radius:14px}
.seg button{border:none;background:transparent;padding:12px;border-radius:11px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--primary);color:#fff}
.seg button.on[data-p="Moncho"]{background:#6C5CE7}
.seg button.on[data-p="Barbi"]{background:#FF7AA8}
.seg button.on[data-p="Compartido"]{background:#00B894}
.seg.small button{padding:7px 12px;font-size:13px}
 
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--border);background:var(--card);padding:8px 14px;border-radius:999px;
  font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.chips .datechip{padding:0;border:none;background:none}
.chips .datechip input{padding:7px 12px;border-radius:999px;font-size:14px;width:auto}
 
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:16px;
  border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:600}
.cat .e{font-size:24px;line-height:1}
.cat.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.selmes{margin-bottom:12px;font-weight:600}
.banner{display:flex;align-items:flex-start;gap:10px;background:rgba(253,203,110,.25);border:1px solid rgba(253,203,110,.8);
  border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.45}
.banner.err{background:rgba(229,72,77,.12);border-color:rgba(229,72,77,.5)}
.banner small{color:var(--muted)}
.banner .x{margin-left:auto;border:none;background:none;font-size:20px;line-height:1;color:var(--muted);padding:0 2px}
.banner .chip{margin-left:auto}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.filtros .full{grid-column:1/-1}
.filtros label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.filtros label.f span{font-size:12px;font-weight:600;color:var(--muted);padding-left:4px}
.filtros select,.filtros input[type=date]{background:var(--card)}
.exp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 2px 0}
.chip.exp{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.chip:disabled{opacity:.5}
.deuda .aviso{font-size:13px;font-weight:600;color:#E17055;margin:-4px 0 10px}
.deuda .res.ok{background:rgba(18,183,106,.13)}
.deuda .res.ok .v{color:#12B76A}
.deuda .res.warn{background:rgba(253,203,110,.22)}
.deuda .acciones{display:grid;gap:8px;margin-top:10px}
.deuda .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.deuda .who{background:var(--bg);border-radius:16px;padding:12px}
.deuda .who small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.deuda .who b{display:block;font-family:var(--round);font-size:22px;font-weight:800;margin-top:4px}
.deuda .res{border-radius:16px;padding:14px;text-align:center;background:var(--primary-soft)}
.deuda .res .l{font-size:15px}
.deuda .res .v{font-family:var(--round);font-size:32px;font-weight:800;color:var(--primary);margin:2px 0 4px}
.deuda .nota{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4}
.btn{border:none;border-radius:16px;padding:15px;font-weight:700;font-size:16px;width:100%}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 8px 20px rgba(108,92,231,.3)}
.btn.primary:active{transform:scale(.99)}
.btn.ghost{background:var(--bg);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger)}
.btn:disabled{opacity:.6}
 
/* Listas */
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--border);
  background:var(--card);padding:12px 14px;border-radius:16px;margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.grow b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow small{color:var(--muted);font-size:12px}
.amt{font-family:var(--round);font-weight:800;white-space:nowrap}
.dayh{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600;margin:18px 4px 8px}
.empty{text-align:center;color:var(--muted);padding:36px 12px;line-height:1.5}
 
/* Resumen */
.total{font-family:var(--round);font-size:38px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:16px 0 10px;background:var(--bg)}
.split-l{display:flex;flex-wrap:wrap;justify-content:space-between;font-size:13px;gap:4px 12px}
.split-l i,.rk i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.chartbox{position:relative;height:250px}
.rk{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 0}
.rk-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px}
.rk small{color:var(--muted);font-size:12px}
.rk.off{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
 
/* Navegación */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);z-index:20}
.nav-in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:560px;gap:6px}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px;border-radius:14px;color:var(--muted);font-size:12px;font-weight:600}
.nav button.on{color:var(--primary);background:var(--primary-soft)}
 
/* Hoja de edición */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(10,12,30,.5)}
.sheet-body{position:relative;width:100%;max-width:560px;background:var(--card);
  border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));
  animation:up .22s ease-out;max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-body h2{margin:0 0 4px;font-size:18px}
 
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:#1E2233;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger)}
 
/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login .box{width:100%;max-width:380px}
#login .logo{width:72px;height:72px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;
  background:linear-gradient(135deg,#6C5CE7,#9B8CFF);color:#fff;font-size:38px;font-weight:800;
  box-shadow:0 10px 28px rgba(108,92,231,.35)}
#login h1{text-align:center;margin:0 0 4px}
#login p{text-align:center;color:var(--muted);margin:0 0 22px}
#login input{margin-bottom:10px}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:4px 0 10px;text-align:center}

/* ===== Rediseño visual: Liquid Glass ===== */
:root {
  --bg: #eef1fb;
  --card: rgba(255,255,255,.76);
  --text: #171a2b;
  --muted: #737b94;
  --border: rgba(255,255,255,.78);
  --primary: #6557e8;
  --primary-soft: rgba(101,87,232,.12);
  --danger: #e5485d;
  --shadow: 0 12px 36px rgba(39,46,92,.09), inset 0 1px 0 rgba(255,255,255,.8);
}
:root[data-theme="dark"] {
  --bg: #0b1020;
  --card: rgba(25,31,52,.76);
  --text: #f4f5ff;
  --muted: #a0a8c0;
  --border: rgba(255,255,255,.10);
  --primary: #a49aff;
  --primary-soft: rgba(164,154,255,.15);
  --shadow: 0 16px 42px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.06);
}
html {
  background:
    radial-gradient(ellipse at 8% 0%, rgba(123,109,255,.18), transparent 36%),
    radial-gradient(ellipse at 95% 18%, rgba(79,174,255,.13), transparent 32%),
    var(--bg);
  background-attachment: fixed;
}
body {
  background: transparent;
  letter-spacing: -.012em;
}
button, input, select { transition: background .22s ease, border-color .22s ease, box-shadow .22s ease, transform .22s ease, color .22s ease; }
button { touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--primary) 55%, transparent);
  outline-offset: 3px;
}
#app { padding-top: calc(env(safe-area-inset-top,0px) + 18px); }
.hero {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 12% 0%, rgba(255,255,255,.28), transparent 42%),
    radial-gradient(ellipse at 100% 100%, rgba(117,221,255,.20), transparent 42%),
    linear-gradient(135deg, #5145d8 0%, #7868ef 48%, #9d91ff 100%);
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 30px;
  padding: 21px 20px 17px;
  box-shadow: 0 18px 42px rgba(91,77,214,.26), inset 0 1px 0 rgba(255,255,255,.38);
}
.hero::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: 230px; height: 230px;
  right: -95px; top: -130px;
  border-radius: 50%;
  background: rgba(255,255,255,.18);
  filter: blur(2px);
}
.hero .t { font-size: 20px; letter-spacing: -.035em; }
.hero .big { font-size: clamp(28px, 7vw, 36px); letter-spacing: -.045em; }
.icon-btn {
  background: rgba(255,255,255,.17);
  border: 1px solid rgba(255,255,255,.28);
  border-radius: 15px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
}
.icon-btn:hover { background: rgba(255,255,255,.28); transform: translateY(-1px); }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 18px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(24px) saturate(145%);
  -webkit-backdrop-filter: blur(24px) saturate(145%);
}
.amount-card { padding: 25px 16px; }
.amount input { letter-spacing: -.06em; }
.lbl { letter-spacing: .005em; }
input[type=text], input[type=email], input[type=password], input[type=search],
input[type=date], input[type=number], select {
  border-radius: 16px;
  border-color: var(--border);
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  box-shadow: inset 0 1px 2px rgba(30,35,80,.025);
}
input:focus, select:focus {
  border-color: color-mix(in srgb, var(--primary) 70%, white);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 13%, transparent);
}
.seg {
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 4px;
}
.seg button { border-radius: 12px; }
.seg button.on {
  box-shadow: 0 4px 12px color-mix(in srgb, var(--primary) 22%, transparent), inset 0 1px 0 rgba(255,255,255,.22);
}
.chip, .cat, .item {
  border-color: var(--border);
  box-shadow: 0 3px 12px rgba(28,35,75,.035), inset 0 1px 0 rgba(255,255,255,.45);
}
.chip {
  background: var(--card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.chip:hover, .cat:hover, .item:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
.chip.on { background: var(--primary-soft); }
.cat { border-radius: 19px; padding: 15px 4px; }
.cat .e { font-size: 25px; margin-bottom: 3px; }
.cat.on { box-shadow: 0 6px 18px color-mix(in srgb, var(--primary) 13%, transparent), inset 0 1px 0 rgba(255,255,255,.45); }
.btn {
  border-radius: 17px;
  min-height: 50px;
  letter-spacing: -.015em;
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
.btn.primary {
  background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 72%, #b7aaff));
  box-shadow: 0 9px 22px color-mix(in srgb, var(--primary) 28%, transparent), inset 0 1px 0 rgba(255,255,255,.24);
}
.btn.primary:hover { transform: translateY(-1px); filter: brightness(1.04); box-shadow: 0 13px 28px color-mix(in srgb, var(--primary) 32%, transparent); }
.btn.primary:active { transform: scale(.985); }
.btn.ghost { border: 1px solid var(--border); background: var(--card); }
.btn.danger { border: 1px solid color-mix(in srgb, var(--danger) 18%, transparent); }
.item {
  border-radius: 18px;
  background: var(--card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.total { letter-spacing: -.055em; }
.res { border: 1px solid var(--border); }
.nav {
  background: color-mix(in srgb, var(--card) 78%, transparent);
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  border-top: 1px solid var(--border);
  box-shadow: 0 -10px 32px rgba(26,31,72,.06);
}
.nav button { border-radius: 16px; min-height: 54px; }
.nav button.on { box-shadow: inset 0 1px 0 rgba(255,255,255,.45); }
.sheet-bg { background: rgba(8,11,28,.48); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); }
.sheet-body {
  border: 1px solid var(--border);
  box-shadow: 0 -18px 55px rgba(0,0,0,.16);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
}
.toast { box-shadow: 0 10px 28px rgba(0,0,0,.18); backdrop-filter: blur(18px); }
#login .logo {
  border: 1px solid rgba(255,255,255,.38);
  box-shadow: 0 14px 32px rgba(91,77,214,.28), inset 0 1px 0 rgba(255,255,255,.35);
}
#login .box { padding: 26px; border-radius: 28px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; scroll-behavior: auto !important; }
}
@media (max-width: 380px) {
  #app { padding-left: 12px; padding-right: 12px; }
  .hero { padding: 18px 15px 14px; border-radius: 25px; }
  .card { padding: 15px; border-radius: 21px; }
  .cats { gap: 6px; }
  .cat { font-size: 12px; }
}

</style>
</head>
<body>
 
<!-- LOGIN -->
<div id="login" class="hidden">
  <form class="box" id="loginForm">
    <div class="logo">€</div>
    <h1>Gastos de casa</h1>
    <p>Inicia sesión para continuar</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" id="loginBtn" type="submit">Entrar</button>
  </form>
</div>
 
<!-- APP -->
<div id="app" class="hidden">
  <header class="hero">
    <div class="hero-top">
      <div class="t">
        <svg class="flag" viewBox="0 0 30 20" role="img" aria-label="España"><rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/></svg>

const SUPABASE_URL = 'https://ezfpytnqsdgkbqviigdp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xKVBZQPg2UmOWLUVsBA1Mg_jFelORoc';

const PERSONAS = ['Moncho', 'Barbi', 'Compartido'];
const COLOR = { Moncho: '#6C5CE7', Barbi: '#FF7AA8', Compartido: '#00B894' };
const PALETA = ['#6C5CE7','#00B894','#FDCB6E','#FF7675','#0984E3','#E17055','#A29BFE','#55EFC4','#B2BEC3'];
 
const CATEGORIAS = ['Supermercado', 'Wifi', 'Luz', 'Agua', 'Calefacción', 'Limpieza', 'Otros'];
const ICON = { Supermercado: '🛒', Wifi: '📶', Luz: '💡', Agua: '💧', 'Calefacción': '🔥', Limpieza: '🧹', Otros: '✨' };
const CAT_COLOR = { Supermercado: '#6C5CE7', Wifi: '#0984E3', Luz: '#FDCB6E', Agua: '#00B894', 'Calefacción': '#E17055', Limpieza: '#A3CB38', Otros: '#A0A6B8' };
const sinAcentos = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const CAT_MAP = Object.fromEntries(CATEGORIAS.map(c => [sinAcentos(c), c]));
const categoriaDe = concepto => CAT_MAP[sinAcentos(concepto)] || 'Otros';
 
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoyISO = () => iso(new Date());
const ayerISO = () => { const d = new Date(); d.setDate(d.getDate() - 1); return iso(d); };
const eur = n => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(n);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const norm = s => cap(s.trim().toLowerCase().replace(/\s+/g, ' '));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = arr => arr.reduce((s, g) => s + g.importe, 0);
const parseImporte = v => { const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? Math.round(n * 100) / 100 : NaN; };
const fechaCorta = s => new Date(s + 'T00:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
const diaLabel = s => {
  if (s === hoyISO()) return 'Hoy';
  if (s === ayerISO()) return 'Ayer';
  return cap(new Date(s + 'T00:00:00').toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }));
};
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
 
const state = {

  persona: PERSONAS.includes(store.get('persona')) ? store.get('persona') : 'Moncho',

};

// ---------- Banner de avisos ----------
function mostrarBanner(html, { err = false, reintentar = false } = {}) {

}

// Aviso si hace 7 días o más que no se registra nada (último gasto creado o último mes liquidado)
function avisarInactividad() {
  if (state.inactCerrado || !state.gastos.length) return;
  const marcas = [...state.gastos.map(g => g.creado_en), ...Object.values(state.liq).map(l => l.liquidado_el)]
    .filter(Boolean).map(t => new Date(t).getTime()).filter(t => !isNaN(t));
  if (!marcas.length) return;
  const ultima = marcas.reduce((a, b) => (b > a ? b : a), 0);
  const dias = Math.floor((Date.now() - ultima) / 864e5);
  if (dias >= 7) mostrarBanner(`⏰ Hace <b>${dias} días</b> que no se anota ningún gasto. ¿Se os ha olvidado alguno?`);
}
 
// ---------- Datos ----------
async function cargar() {
  let todo = [], desde = 0; const PAG = 1000;
  while (true) {
    const { data, error } = await sb.from('gastos').select('*')
      .order('fecha', { ascending: false }).order('id', { ascending: false }).range(desde, desde + PAG - 1);
    if (error) {
      mostrarBanner(`<b>No se pudo conectar con la base de datos.</b> Si llevas más de una semana sin usar la app, Supabase puede haber pausado el proyecto: entra en <b>supabase.com</b> y pulsa <b>Restore project</b>.<br><small>${esc(error.message)}</small>`,
        { err: true, reintentar: true });
      return;
    }
    todo = todo.concat(data);
    if (data.length < PAG) break;
    desde += PAG;
  }
  // "tipo" = una de las categorías. Cualquier concepto antiguo que no sea una de ellas cuenta como "Otros".
  const { data: liq, error: eLiq } = await sb.from('liquidaciones').select('*');
  state.liqOk = !eLiq;
  state.liq = eLiq ? {} : Object.fromEntries(liq.map(l => [l.mes, { ...l, importe: Number(l.importe) }]));
  state.gastos = todo.map(g => {
    const tipo = categoriaDe(g.concepto);
    const detalle = tipo !== 'Otros' ? '' : (g.detalle || (CAT_MAP[sinAcentos(g.concepto)] ? '' : g.concepto || ''));
    return { ...g, importe: Number(g.importe), tipo, detalle };
  });
  ocultarBanner(); avisarInactividad();
  renderTodo();
}
 
function tiposPorFrecuencia() {
  const m = new Map();
  state.gastos.forEach(g => m.set(g.tipo, (m.get(g.tipo) || 0) + 1));
  return [...m].sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
 
// ---------- Rangos y filtros ----------
function mesRango(offset = 0) {
  const n = new Date(); const y = n.getFullYear(), m = n.getMonth() + offset;
  return [iso(new Date(y, m, 1)), iso(new Date(y, m + 1, 0))];
}
function rango() {
  const y = new Date().getFullYear();
  switch (state.periodo) {
    case 'mes': return mesRango(0);
    case 'mespasado': return mesRango(-1);
    case 'anio': return [`${y}-01-01`, `${y}-12-31`];
    case 'rango': return [state.desde || '0000-01-01', state.hasta || '9999-12-31'];
    default: return ['0000-01-01', '9999-12-31'];
  }
}
function filtrar(ini, fin) {
  return state.gastos.filter(g => g.fecha >= ini && g.fecha <= fin &&
    (!state.fPersona || g.persona === state.fPersona) &&
    (state.fTipos.size === 0 || state.fTipos.has(g.tipo)));
}
 
// ---------- Render general ----------
function renderTodo() {
  const [a, b] = mesRango(0);
  $('#heroTotal').textContent = eur(sum(state.gastos.filter(g => g.fecha >= a && g.fecha <= b)));
  $('#mesNombre').textContent = new Date().toLocaleDateString('es-ES', { month: 'long' });

}

    <span class="amt">${eur(g.importe)}</span></button>`;
}
 
// ---------- Gráfica de la cabecera: mes en curso vs mes anterior (gasto acumulado por día) ----------
let heroChart = null;
function dibujarHero() {
  const ahora = new Date(), y = ahora.getFullYear(), m = ahora.getMonth(), hoy = ahora.getDate();
  const diasMes = new Date(y, m + 1, 0).getDate(), diasPrev = new Date(y, m, 0).getDate();
  const [a, b] = mesRango(0), [pa, pb] = mesRango(-1);
  const acumular = (ini, fin, dias, hasta) => {
    const por = Array(dias).fill(0);
    state.gastos.forEach(g => { if (g.fecha >= ini && g.fecha <= fin) por[Number(g.fecha.slice(8, 10)) - 1] += g.importe; });
    let acc = 0;
    return por.map((v, i) => { acc += v; return i < hasta ? Math.round(acc * 100) / 100 : null; });
  };
  const n = Math.max(diasMes, diasPrev);
  const rellenar = arr => arr.concat(Array(n - arr.length).fill(null));
  const actual = rellenar(acumular(a, b, diasMes, hoy));
  const previoCompleto = acumular(pa, pb, diasPrev, diasPrev);
  const previo = rellenar(previoCompleto);
  const nombre = d => cap(d.toLocaleDateString('es-ES', { month: 'long' }));
  const nAct = nombre(new Date(y, m, 1)), nPrev = nombre(new Date(y, m - 1, 1));
  const totAct = sum(state.gastos.filter(g => g.fecha >= a && g.fecha <= b));
  const totPrev = sum(state.gastos.filter(g => g.fecha >= pa && g.fecha <= pb));
 
  // Frase de comparación: este mes hasta hoy vs. el mes pasado a esta misma altura
  const alDia = previoCompleto[Math.min(hoy, diasPrev) - 1] || 0;
  const dif = Math.round((totAct - alDia) * 100) / 100;
  $('#heroCmp').textContent = totPrev === 0 ? 'Aún no hay datos del mes pasado para comparar'
    : dif === 0 ? `Igual que a esta altura de ${nPrev.toLowerCase()}`
    : `${dif > 0 ? '▲' : '▼'} ${eur(Math.abs(dif))} ${dif > 0 ? 'más' : 'menos'} que a esta altura de ${nPrev.toLowerCase()}`;
 
  $('#heroLeg').innerHTML =
    `<span><i class="lg"></i>${nAct} (hasta hoy): ${eur(totAct)}</span><span><i class="lg dash"></i>${nPrev} (completo): ${eur(totPrev)}</span>`;
 
  // Etiqueta con el total actual junto al punto de hoy
  const etiquetaHoy = {
    id: 'etiquetaHoy',
    afterDatasetsDraw(chart) {
      const pt = chart.getDatasetMeta(0).data[hoy - 1];
      if (!pt) return;
      const { ctx, chartArea } = chart;
      const txt = eur(totAct);
      ctx.save();
      ctx.font = '800 12px Nunito, system-ui, sans-serif';
      ctx.fillStyle = '#fff';
      ctx.textBaseline = 'bottom';
      const w = ctx.measureText(txt).width;
      ctx.fillText(txt, Math.min(Math.max(pt.x - w / 2, chartArea.left), chartArea.right - w + 6), pt.y - 11);
      ctx.restore();
    },
  };
 
  const puntos = actual.map((v, i) => i === hoy - 1 ? 6 : 0);
  const animar = heroChart ? false : { duration: 600 };
  heroChart?.destroy();
  heroChart = new Chart($('#chartHero'), {
    type: 'line',
    data: {
      labels: Array.from({ length: n }, (_, i) => i + 1),
      datasets: [
        { label: nAct, data: actual, borderColor: '#fff', borderWidth: 3.5, backgroundColor: 'rgba(255,255,255,.14)',
          fill: 'origin', cubicInterpolationMode: 'monotone', pointRadius: puntos, pointBackgroundColor: '#fff',
          pointBorderColor: '#6C5CE7', pointBorderWidth: 3, spanGaps: false },
        { label: nPrev, data: previo, borderColor: 'rgba(255,255,255,.8)', borderWidth: 2, borderDash: [6, 5],
          fill: false, cubicInterpolationMode: 'monotone', pointRadius: 0, spanGaps: false },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: animar,
      layout: { padding: { top: 16, right: 8, left: 0, bottom: 0 } },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: 'rgba(20,18,50,.92)', titleColor: '#fff', bodyColor: '#fff',
          padding: 10, cornerRadius: 10, displayColors: false,
          callbacks: { title: it => `Día ${it[0].label}`, label: c => `${c.dataset.label}: ${eur(c.parsed.y)}` } },
      },
      scales: {
        x: { grid: { display: false }, border: { display: false },
          ticks: { color: 'rgba(255,255,255,.85)', font: { size: 11 }, autoSkip: false, maxRotation: 0,
                   callback: (v, i) => (i === 0 || (i + 1) % 5 === 0) ? i + 1 : '' } },
        y: { beginAtZero: true, grace: '18%', border: { display: false }, grid: { color: 'rgba(255,255,255,.18)' },
          ticks: { color: 'rgba(255,255,255,.85)', font: { size: 11 }, maxTicksLimit: 4, callback: v => v + ' €' } },
      },
    },
    plugins: [etiquetaHoy],
  });
}

const SVG_LUNA = '<svg class="i" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
const SVG_SOL = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';

function renderRecent() {
  const r = state.gastos.slice(0, 5);
  $('#recent').innerHTML = r.length ? r.map(itemHTML).join('')
    : '<div class="empty">Aún no hay gastos.<br>¡Añade el primero arriba! 👆</div>';

async function guardar() {

// ---------- Cuentas del mes: quién debe a quién ----------
// Lo que paga Moncho o Barbi se reparte a partes iguales. "Compartido" sale de la cuenta común y no cuenta.
const r2 = x => Math.round(x * 100) / 100;
const claveMes = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const nombreMes = k => cap(new Date(k + '-01T00:00:00').toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }).replace(' de ', ' '));
function saldoMes(clave) {
  const mes = state.gastos.filter(g => g.fecha.slice(0, 7) === clave);
  const moncho = sum(mes.filter(g => g.persona === 'Moncho'));
  const barbi = sum(mes.filter(g => g.persona === 'Barbi'));
  const comun = sum(mes.filter(g => g.persona === 'Compartido'));
  const dif = r2(moncho - barbi);
  return { moncho, barbi, comun, dif, deuda: r2(Math.abs(dif) / 2),
           deudor: dif > 0 ? 'Barbi' : 'Moncho', acreedor: dif > 0 ? 'Moncho' : 'Barbi' };
}
// Estado de un mes: vacio | paz | pendiente | liquidado | cambiado (se liquidó y después varió el saldo)
function estadoMes(k) {
  const s = saldoMes(k);
  if (s.moncho + s.barbi === 0) return { s, tipo: 'vacio' };
  if (s.dif === 0) return { s, tipo: 'paz' };
  const l = state.liq[k];
  if (!l) return { s, tipo: 'pendiente' };
  if (l.importe === s.deuda && l.deudor === s.deudor) return { s, tipo: 'liquidado', l };
  return { s, tipo: 'cambiado', l };
}
const fechaLarga = iso => new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
 
function renderDeuda() {
  const actual = claveMes(new Date());
  const claves = [...new Set([actual, ...state.gastos.map(g => g.fecha.slice(0, 7))])].sort().reverse();
  const clave = claves.includes(state.deudaMes) ? state.deudaMes : actual;
  const { s, tipo, l } = estadoMes(clave);
 
  const etiqueta = k => `<option value="${k}" ${k === clave ? 'selected' : ''}>${nombreMes(k)}</option>`;
  const pend = claves.filter(k => ['pendiente', 'cambiado'].includes(estadoMes(k).tipo));
  const aviso = state.liqOk && pend.length
    ? `<div class="aviso">⏳ Pendiente de liquidar: ${pend.map(k => nombreMes(k)).join(', ')}</div>` : '';
 
  const quien = (p, v) => `<div class="who"><small><i class="dot" style="background:${COLOR[p]}"></i>${p} ha pagado</small><b>${eur(v)}</b></div>`;
  const btnLiq = txt => state.liqOk ? `<button class="btn primary" id="btnLiq" data-mes="${clave}">${txt}</button>` : '';
  const btnUndo = `<button class="btn ghost" id="btnDeshacer" data-mes="${clave}">Deshacer liquidación</button>`;
  const reparto = `Entre los dos habéis pagado ${eur(s.moncho + s.barbi)}: ${eur((s.moncho + s.barbi) / 2)} cada uno.`;
 
  let resultado;
  if (tipo === 'vacio') {
    resultado = `<div class="res"><div class="l"><b>✅ Estáis en paz</b></div><div class="sub">No hay gastos de Moncho ni de Barbi en este mes.</div></div>`;
  } else if (tipo === 'paz') {
    resultado = `<div class="res"><div class="l"><b>✅ Estáis en paz</b></div><div class="sub">Habéis pagado lo mismo cada uno.</div></div>`;
  } else if (tipo === 'pendiente') {
    resultado = `<div class="res"><div class="l"><b>${s.deudor}</b> debe a <b>${s.acreedor}</b></div><div class="v">${eur(s.deuda)}</div><div class="sub">${reparto}</div></div>
      <div class="acciones">${btnLiq('Marcar como liquidado')}</div>`;
  } else if (tipo === 'liquidado') {
    resultado = `<div class="res ok"><div class="l"><b>✅ Liquidado</b></div><div class="v">${eur(l.importe)}</div>
      <div class="sub">${l.deudor} pagó a ${l.acreedor} · ${fechaLarga(l.liquidado_el)}</div></div>
      <div class="acciones">${btnUndo}</div>`;
  } else {
    resultado = `<div class="res warn"><div class="l"><b>⚠️ El saldo ha cambiado desde que se liquidó</b></div>
      <div class="sub">Se liquidaron ${eur(l.importe)} (${l.deudor} → ${l.acreedor}). Ahora el saldo es: ${s.deudor} debe ${eur(s.deuda)} a ${s.acreedor}.</div></div>
      <div class="acciones">${btnLiq('Marcar como liquidado con el nuevo saldo')}${btnUndo}</div>`;
  }
 
  $('#deuda').innerHTML = `<h3>Cuentas del mes</h3>${aviso}
    <select id="selMes" class="selmes" aria-label="Elegir mes">${claves.map(etiqueta).join('')}</select>
    <div class="pair">${quien('Moncho', s.moncho)}${quien('Barbi', s.barbi)}</div>${resultado}
    ${s.comun > 0 ? `<div class="nota">Los gastos Compartidos (cuenta común, ${eur(s.comun)}) no cuentan en este reparto.</div>` : ''}
    ${!state.liqOk ? `<div class="nota">⚠️ Falta crear la tabla «liquidaciones» en Supabase para poder marcar meses como liquidados.</div>` : ''}`;
}
 
async function liquidar(clave, btn) {
  const s = saldoMes(clave);
  btn.disabled = true;
  const { error } = await sb.from('liquidaciones').upsert(
    { mes: clave, importe: s.deuda, deudor: s.deudor, acreedor: s.acreedor, liquidado_el: new Date().toISOString() });
  if (error) { btn.disabled = false; return toast('No se pudo guardar: ' + error.message, true); }
  toast('✅ Mes marcado como liquidado');
  await cargar();
}
async function deshacerLiquidacion(clave, btn) {
  btn.disabled = true;
  const { error } = await sb.from('liquidaciones').delete().eq('mes', clave);
  if (error) { btn.disabled = false; return toast('No se pudo deshacer: ' + error.message, true); }
  toast('Liquidación deshecha');
  await cargar();
}
 
// ---------- Pestaña: Resumen ----------
let chart = null;
function renderResumen() {
  renderDeuda();
  const P = [['mes', 'Este mes'], ['mespasado', 'Mes pasado'], ['anio', 'Este año'], ['todo', 'Todo'], ['rango', 'Fechas concretas']];
  const opts = (lista, actual) => lista.map(([v, l]) => `<option value="${v}" ${v === actual ? 'selected' : ''}>${l}</option>`).join('');
  $('#fPeriodo').innerHTML = opts(P, state.periodo);
  $('#rangoBox').classList.toggle('hidden', state.periodo !== 'rango');
  $('#fQuien').innerHTML = opts([['', 'Todos'], ...PERSONAS.map(p => [p, p])], state.fPersona || '');
  const tipoSel = state.fTipos.size === 1 ? [...state.fTipos][0] : '';
  $('#fConcepto').innerHTML = opts([['', 'Todos'], ...CATEGORIAS.map(t => [t, `${ICON[t]} ${t}`])], tipoSel);
 
  const [ini, fin] = rango();
  const f = filtrar(ini, fin);
  $('#sumEmpty').classList.toggle('hidden', f.length > 0);
  $('#sumBody').classList.toggle('hidden', f.length === 0);
  if (!f.length) return;
 
  // Tarjeta total
  const total = sum(f);
  const por = Object.fromEntries(PERSONAS.map(p => [p, sum(f.filter(g => g.persona === p))]));
  const pje = p => total ? (por[p] / total) * 100 : 0;
  let extra = `${f.length} gasto${f.length === 1 ? '' : 's'}`;
  if (state.periodo === 'mes') {
    const [pi, pf] = mesRango(-1); const prev = sum(filtrar(pi, pf));
    if (prev > 0) extra += ` · mes pasado: ${eur(prev)}`;
  }
  $('#kpi').innerHTML = `<div class="sub">Total</div><div class="total">${eur(total)}</div><div class="sub">${extra}</div>
    <div class="split">${PERSONAS.map(p => `<span style="width:${pje(p)}%;background:${COLOR[p]}"></span>`).join('')}</div>
    <div class="split-l">${PERSONAS.map(p => `<span><i style="background:${COLOR[p]}"></i>${p} ${eur(por[p])} · ${pje(p).toFixed(0)}%</span>`).join('')}</div>`;
 
  // Gráfico de evolución
  const fechas = f.map(g => g.fecha).sort();
  const dias = (new Date(fechas.at(-1)) - new Date(fechas[0])) / 864e5;
  const auto = dias <= 62 ? 'dia' : dias <= 800 ? 'mes' : 'anio';
  const agr = state.agrup || auto;
  $$('#segAgrup button').forEach(x => x.classList.toggle('on', x.dataset.a === agr));
  const keyOf = g => agr === 'dia' ? g.fecha : agr === 'mes' ? g.fecha.slice(0, 7) : g.fecha.slice(0, 4);
  const mapa = new Map();
  f.forEach(g => { const k = keyOf(g); if (!mapa.has(k)) mapa.set(k, Object.fromEntries(PERSONAS.map(p => [p, 0]))); mapa.get(k)[g.persona] += g.importe; });
  const keys = [...mapa.keys()].sort();
  const etiqueta = k => agr === 'dia' ? fechaCorta(k)
    : agr === 'mes' ? new Date(k + '-01T00:00:00').toLocaleDateString('es-ES', { month: 'short', year: '2-digit' }) : k;
  const css = getComputedStyle(document.documentElement);
  Chart.defaults.color = css.getPropertyValue('--muted').trim();
  Chart.defaults.font.family = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  chart?.destroy();
  chart = new Chart($('#chartTiempo'), {
    type: 'bar',
    data: {
      labels: keys.map(etiqueta),
      datasets: PERSONAS.map(p => ({ label: p, data: keys.map(k => +mapa.get(k)[p].toFixed(2)),
        backgroundColor: COLOR[p], borderRadius: 6, borderSkipped: false, maxBarThickness: 34 })),
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${eur(c.parsed.y)}` } } },
      scales: { x: { stacked: true, grid: { display: false } },
        y: { stacked: true, ticks: { callback: v => v + ' €' }, grid: { color: css.getPropertyValue('--border').trim() } } },
    },
  });
 
  // Ranking por concepto (todo lo de «Otros» se agrupa en una sola fila)
  const porTipo = new Map();
  f.forEach(g => porTipo.set(g.tipo, (porTipo.get(g.tipo) || 0) + g.importe));
  const arr = [...porTipo].sort((x, y) => y[1] - x[1]);
  $('#rank').innerHTML = arr.map(([t, v]) => {
    const pct = total ? (v / total) * 100 : 0;
    return `<button class="rk" data-t="${esc(t)}">
      <div class="rk-top"><span><i style="background:${CAT_COLOR[t]}"></i>${ICON[t]} ${esc(t)}</span><b>${eur(v)}</b></div>
      <div class="bar"><span style="width:${pct}%;background:${CAT_COLOR[t]}"></span></div>
      <small>${pct.toFixed(0)}%</small></button>`;
  }).join('');
}
 
// ---------- Pestaña: Movimientos ----------
function renderMovs() {
  const q = $('#buscar').value.trim().toLowerCase();
  let rows = state.gastos;
  if (q) rows = rows.filter(g => g.tipo.toLowerCase().includes(q) || g.detalle.toLowerCase().includes(q) || g.persona.toLowerCase().includes(q));
  state.movsVisibles = rows;
  $('#movCount').textContent = `${rows.length} movimiento${rows.length === 1 ? '' : 's'}`;
  $('#btnExport').disabled = !rows.length;
  if (!rows.length) { $('#movs').innerHTML = '<div class="empty">No hay movimientos.</div>'; return; }
  const total = rows.length; rows = rows.slice(0, state.limite);
  const grupos = new Map();
  rows.forEach(g => { if (!grupos.has(g.fecha)) grupos.set(g.fecha, []); grupos.get(g.fecha).push(g); });
  let html = '';
  grupos.forEach((lista, fecha) => {
    html += `<div class="dayh"><span>${diaLabel(fecha)}</span><span>${eur(sum(lista))}</span></div>` + lista.map(itemHTML).join('');
  });
  if (total > rows.length) html += `<button class="btn ghost" id="verMas" style="margin-top:8px">Ver más (${total - rows.length})</button>`;
  $('#movs').innerHTML = html;
}
 
// ---------- Exportar a Excel (CSV) ----------
async function exportarCSV() {
  const rows = state.movsVisibles || [];
  if (!rows.length) return toast('No hay movimientos que exportar', true);
  const txt = v => {
    let s = String(v ?? '');
    if (/^[=+\-@]/.test(s)) s = "'" + s;                       // evita que Excel lo interprete como fórmula
    return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const fecha = f => `${f.slice(8, 10)}/${f.slice(5, 7)}/${f.slice(0, 4)}`;
  const lineas = [['Fecha', 'Quién', 'Concepto', 'Detalle', 'Importe (€)'].join(';')];
  rows.forEach(g => lineas.push([fecha(g.fecha), g.persona, g.tipo, txt(g.detalle), g.importe.toFixed(2).replace('.', ',')].join(';')));
  const nombre = `gastos-porlier80-${hoyISO()}.csv`;
  // BOM + separador ";" + coma decimal: se abre directamente en Excel en español
  const file = new File(['\uFEFF' + lineas.join('\r\n')], nombre, { type: 'text/csv;charset=utf-8' });
 
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: nombre }); return; }
    catch (e) { if (e.name === 'AbortError') return; }          // si cancela, no hacemos nada; si falla, descarga normal
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast(`⬇️ ${rows.length} movimiento${rows.length === 1 ? '' : 's'} exportados`);
}
 
// ---------- Hoja de edición ----------
function abrirSheet(id) {
  const g = state.gastos.find(x => String(x.id) === String(id)); if (!g) return;
  state.edit = { ...g };
  $('#sImporte').value = String(g.importe).replace('.', ',');
  $('#sCat').value = g.tipo; $('#sDetalle').value = g.detalle; $('#sDetalle').classList.toggle('hidden', g.tipo !== 'Otros');
  $('#sFecha').value = g.fecha;
  $$('#sSeg button').forEach(b => b.classList.toggle('on', b.dataset.p === g.persona));
  $('#sheet').classList.remove('hidden');
}
function cerrarSheet() { $('#sheet').classList.add('hidden'); state.edit = null; resetBorrar(); }
function resetBorrar() { const b = $('#sBorrar'); delete b.dataset.arm; b.textContent = 'Borrar gasto'; }
 
async function guardarEdicion() {
  const importe = parseImporte($('#sImporte').value), cat = $('#sCat').value, detalle = cap($('#sDetalle').value.trim());
  if (!(importe > 0)) return toast('Importe no válido', true);
  if (cat === 'Otros' && !detalle) return toast('Escribe qué gasto es', true);
  const persona = $('#sSeg .on')?.dataset.p || state.edit.persona;
  const { error } = await sb.from('gastos').update({ importe, persona, concepto: cat, detalle: cat === 'Otros' ? detalle : null, fecha: $('#sFecha').value || state.edit.fecha }).eq('id', state.edit.id);
  if (error) return toast('Error: ' + error.message, true);
  cerrarSheet(); toast('Cambios guardados ✅'); await cargar();
}
async function borrarGasto() {
  const b = $('#sBorrar');
  if (!b.dataset.arm) { b.dataset.arm = '1'; b.textContent = '¿Seguro? Pulsa otra vez'; setTimeout(() => { if (b.dataset.arm) resetBorrar(); }, 3000); return; }
  const { error } = await sb.from('gastos').delete().eq('id', state.edit.id);
  if (error) return toast('Error: ' + error.message, true);
  cerrarSheet(); toast('Gasto borrado 🗑️'); await cargar();
}
 
// ---------- Navegación ----------
function setTab(t) {
  state.tab = t;
  $$('.view').forEach(v => v.classList.toggle('hidden', v.id !== 'view-' + t));
  $$('.nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  window.scrollTo(0, 0);
  if (t === 'sum') { state.deudaMes = null; renderResumen(); }
  if (t === 'list') renderMovs();
}
 
// ---------- Eventos ----------
function bind() {
  $$('.nav button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $('#logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
 
  $('#segPersona').onclick = e => { const b = e.target.closest('button'); if (!b) return;
    state.persona = b.dataset.p; store.set('persona', state.persona); renderPersonaSeg(); };
  $('#sCat').innerHTML = CATEGORIAS.map(c => `<option value="${c}">${ICON[c]} ${c}</option>`).join('');
  $('#sCat').onchange = e => $('#sDetalle').classList.toggle('hidden', e.target.value !== 'Otros');
  $('#chipsCat').onclick = e => { const b = e.target.closest('.cat'); if (!b) return;
    state.cat = b.dataset.c; renderCats(); if (state.cat === 'Otros') $('#detalle').focus(); };
  $('#chipsFecha').onclick = e => { const b = e.target.closest('.chip[data-f]'); if (!b) return;
    $('#fecha').value = b.dataset.f === 'hoy' ? hoyISO() : ayerISO(); marcarFechaChips(); };
  $('#fecha').addEventListener('change', marcarFechaChips);
  $('#guardar').onclick = guardar;
  $('#importe').addEventListener('input', e => { limpiarImporte(e.target); ajustarAncho(); });
  $('#sImporte').addEventListener('input', e => limpiarImporte(e.target));
  $('#themeBtn').onclick = cambiarTema;
  $('#btnExport').onclick = exportarCSV;
  $('#banner').addEventListener('click', e => {
    if (e.target.closest('#bnCerrar')) { state.inactCerrado = true; ocultarBanner(); }
    if (e.target.closest('#bnReintentar')) cargar();
  });
  $('#deuda').addEventListener('change', e => { if (e.target.id === 'selMes') { state.deudaMes = e.target.value; renderDeuda(); } });
  $('#deuda').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !b.dataset.mes) return;
    if (b.id === 'btnLiq') liquidar(b.dataset.mes, b);
    if (b.id === 'btnDeshacer') deshacerLiquidacion(b.dataset.mes, b);
  });
  $('#importe').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
  $('#detalle').addEventListener('keydown', e => { if (e.key === 'Enter') guardar(); });
 
  $('#fPeriodo').onchange = e => { state.periodo = e.target.value; state.agrup = null; renderResumen(); };
  $('#fQuien').onchange = e => { state.fPersona = e.target.value || null; renderResumen(); };
  $('#fConcepto').onchange = e => { state.fTipos = e.target.value ? new Set([e.target.value]) : new Set(); renderResumen(); };
  $('#desde').onchange = e => { state.desde = e.target.value; state.agrup = null; renderResumen(); };
  $('#hasta').onchange = e => { state.hasta = e.target.value; state.agrup = null; renderResumen(); };
  // Tocar un concepto del ranking lo filtra; volver a tocarlo quita el filtro
  const toggleTipo = t => { state.fTipos = (state.fTipos.size === 1 && state.fTipos.has(t)) ? new Set() : new Set([t]); renderResumen(); };
  $('#rank').onclick = e => { const b = e.target.closest('.rk'); if (b && !b.disabled) toggleTipo(b.dataset.t); };
  $('#segAgrup').onclick = e => { const b = e.target.closest('button'); if (!b) return; state.agrup = b.dataset.a; renderResumen(); };
 
  $('#buscar').addEventListener('input', () => { state.limite = 120; renderMovs(); });
  $('#movs').onclick = e => {
    if (e.target.closest('#verMas')) { state.limite += 120; return renderMovs(); }
    const it = e.target.closest('.item'); if (it) abrirSheet(it.dataset.id);
  };
  $('#recent').onclick = e => { const it = e.target.closest('.item'); if (it) abrirSheet(it.dataset.id); };
 
  $('#sSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return;
    $$('#sSeg button').forEach(x => x.classList.toggle('on', x === b)); };
  $('#sGuardar').onclick = guardarEdicion;
  $('#sBorrar').onclick = borrarGasto;
  $('#sCerrar').onclick = cerrarSheet;
  $('#sheetBg').onclick = cerrarSheet;
}
 
// ---------- Inicio y login ----------

async function entrar() {
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden'); $('#nav').classList.remove('hidden');

}

  e.preventDefault();
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'Entrando…'; $('#loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#password').value });
  btn.disabled = false; btn.textContent = 'Entrar';

});
 
const { data: { session } } = await sb.auth.getSession();
if (session) entrar(); else $('#login').classList.remove('hidden');
